<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Regisztráció — EventBook</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="auth-bg"><nav class="navbar navbar-dark eb-nav"><div class="container"><a class="navbar-brand fw-bold" href="/">eventbook<span class="brand-dot">.</span></a></div></nav>
<main class="container auth-wrap"><div class="auth-card"><a href="/" class="back-link">← Vissza a rendezvényekhez</a><div class="eyebrow text-primary mt-4">CSATLAKOZZ A KÖZÖSSÉGHEZ</div><h1 class="fw-bold mt-2">Fiók létrehozása</h1><p class="text-secondary">Pár adat, és már foglalhatod is a jegyeidet.</p><div id="form-alert"></div>
<form id="register-form"><label class="form-label mt-2" for="name">Teljes név</label><input class="form-control form-control-lg" id="name" required minlength="2" autocomplete="name"><label class="form-label mt-3" for="email">E-mail-cím</label><input class="form-control form-control-lg" id="email" type="email" required autocomplete="email"><label class="form-label mt-3" for="password">Jelszó</label><input class="form-control form-control-lg" id="password" type="password" required minlength="8" autocomplete="new-password"><div class="form-text">Legalább 8 karakter.</div><button class="btn btn-primary btn-lg w-100 mt-4">Regisztráció</button></form><p class="text-center mt-4 mb-0">Van már fiókod? <a href="login.html">Lépj be!</a></p></div></main>
<script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
