<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin — EventBook</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark eb-nav"><div class="container"><a class="navbar-brand fw-bold" href="/">eventbook<span class="brand-dot">.</span></a><a href="/" class="btn btn-outline-light btn-sm">Oldal megtekintése</a></div></nav><main class="container py-5"><div class="eyebrow text-primary">RENDSZERKEZELÉS</div><h1 class="fw-bold">Adminfelület</h1><p class="text-secondary">Rendezvények létrehozása és az értékesítés áttekintése.</p><div id="admin-alert"></div><div id="stats" class="row g-3 mb-4"></div><div class="admin-panel mb-5"><h2 class="h4 fw-bold">Új rendezvény</h2><form id="event-form" class="row g-3"><div class="col-md-6"><label class="form-label">Rendezvény neve</label><input class="form-control" name="title" required></div><div class="col-md-6"><label class="form-label">Helyszín</label><input class="form-control" name="location" required></div><div class="col-md-6"><label class="form-label">Kategória</label><select class="form-select" name="category"><option>Party</option><option>Koncert</option><option>Fesztivál</option><option>Egyéb</option></select></div><div class="col-md-6"><label class="form-label">Kezdés időpontja</label><input class="form-control" name="start_time" type="datetime-local" required></div><div class="col-12"><label class="form-label">Leírás</label><textarea class="form-control" name="description" rows="3"></textarea></div><div class="col-md-6"><label class="form-label">Jegyár (Ft)</label><input class="form-control" name="price_huf" type="number" min="0" value="2990" required></div><div class="col-md-6"><label class="form-label">Kapacitás</label><input class="form-control" name="capacity" type="number" min="1" value="100" r
